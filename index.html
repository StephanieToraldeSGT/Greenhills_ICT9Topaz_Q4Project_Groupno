<body>
    <div class="login-container">
        <h1>Login</h1>
        <button onclick="toggleInstructions()" class="btn btn-sm btn-secondary mb-3">Show Instructions</button>
        <p id="instructions" style="display: none; padding: 10px; background: #f0f0f0; border-radius: 5px; margin-bottom: 15px;">Enter your username and password, then click Login. <br> TIP: use admin for username and 1234 for password.<br>
         </p>
        <form onsubmit="validateLogin()">
            <div class="mb-3">
                <label class="form-label">Username:</label>
                <input type="text" id="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password:</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="checkbox" id="remember" name="remember_me">
                <label for="remember">Remember me</label>
            </div>

            <button type="submit" class="btn btn-primary w-100" style="color:#b1b0c7; background-color:#e7e7e7; border-color:#b1b0c7;">Login</button>

        </form>

        <p id="output" class="mt-3 text-center"></p>
    </div>

    <script src="main.js"></script>

</body>
