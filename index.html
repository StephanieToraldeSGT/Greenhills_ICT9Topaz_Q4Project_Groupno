<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<title>Login Page</title>

<style>
body {
    background-color: #f8f9fa;
    font-family: Arial, sans-serif;

     background: url("butterdie.png") no-repeat center center fixed;
    background-size: cover;
}

.login-container {
    max-width: 300px;
    margin: 100px auto;
    padding: 40px 25px;
    background: white;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #b1b0c7;
}
</style>

</head>

<body>

  <nav class=" navbar navbar-expand-sm navbar-dark bg-dark">
                <div class="container-fluid">
                    <a href="index.html" class="navbar-brand"><img src="OBMC LOGO.png" alt="OBMC LOGO"></a>
                    <div class="collapse navbar-collapse" id="mynavbar">

                        <input type="text" class="form-control-me-2" placeholder="Search">
                        <button type="button" class="btn btn-primary">Search</button>
                        <div class="collapse navbar-collapse" id="mynavbar">
                            <ul class="navbar-nav me-auto">
                                <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                                <li class="nav-item"><a href="tasks.html" class="nav-link">Tasks</a></li>
                                <li class="nav-item"><a href="classes.html" class="nav-link">Classes</a></li>
                            </ul>
                            </form>
                        </div>
                    </div>
                </div>
            </nav>

<div class="login-container">

    <h1>Login</h1>

    <button onclick="toggleInstructions()" class="btn btn-sm btn-secondary mb-3">
        Show Instructions
    </button>

    <p id="instructions" style="display:none; padding:10px; background:#f0f0f0; border-radius:5px;">
        Enter username and password. Use admin / 1234.
    </p>

    <form onsubmit="validateLogin(event)">

        <div class="mb-3">
            <label class="form-label">Username:</label>
            <input type="text" id="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password:</label>
            <input type="password" id="password" class="form-control" required>
        </div>
        
        <div class="mb-3">
        <input type="checkbox" id="remember">
        <label for="remember">Remember me</label>
    </div>

    <button type="submit" class="btn btn-primary w-100">
        Login
    </button>

</form>
    <p id="output" class="mt-3 text-center"></p>

</div>

<script src="main.js"></script>

</body>
</html>
