<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<link rel="stylesheet" href="style.css">

<style>

.profile-box{
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    text-align: center;
}

.profile-pic{
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #0d6efd;
}

</style>

</head>

<body>

<div class="page-bg">

    <div class="sidebar">

        <div class="sidebar-title">Menu</div>

        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="notebooks.html" class="sidebar-link">Classes</a>
        <a href="tasks.html" class="sidebar-link">Tasks</a>
        <a href="profile.html" class="sidebar-link active">Profile</a>

    </div>

    <div class="main-content">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <a href="index.html" class="navbar-brand">
                    <img src="OBMC LOGO.png" width="50" height="50">
                </a>
            </div>
        </nav>

        <div class="container mt-4">

            <div class="profile-box">

                <img id="preview" src="png.png" class="profile-pic">

                <h3 class="mt-3">admin</h3>

                <p class="text-muted">Grade 9 - Topaz</p>

                <form>

                    <input type="file" accept="image/*"
                    onchange="document.getElementById('preview').src = URL.createObjectURL(this.files[0])"
                    class="form-control mt-3">

                </form>

                <div class="mt-3 text-start">

                    <h5>Account Information</h5>

                    <p><strong>Username:</strong> admin</p>
                    <p><strong>Password:</strong> 1234</p>

                </div>

                <a href="dashboard.html" class="btn btn-primary mt-3">
                    Back to Dashboard
                </a>

                <a href="index.html" class="btn btn-danger mt-2">
                    Log Out
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
